services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - stt-data:/app/data
      - stt-models:/app/models
    gpus: all
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  stt-data:
  stt-models:
